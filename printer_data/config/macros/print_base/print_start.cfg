# Voron Trident print startup
# Slicer parameters (defaults): BED=110C, EXTRUDER=260C, SOAK=30 minutes.
# For bed targets >70C, run HEATSOAK_BED; otherwise wait for target temperature.

[gcode_macro PRINT_START]
description: Prepare the Trident for a print
gcode:
  # ---------------------------------------------------------------------------
  # Slicer parameters and printer settings
  # ---------------------------------------------------------------------------
  {% set target_bed = params.BED|default(110)|int %}
  {% set target_extruder = params.EXTRUDER|default(260)|int %}
  {% set soak_time = params.SOAK|default(30)|int %}
  {% set warmup_temp = 150 %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
  {% set lights = printer["gcode_macro _USER_VARIABLES_OTHER"] %}
  {% set purge = printer["gcode_macro clean_nozzle"] %}

  # ---------------------------------------------------------------------------
  # Initialize lights, offsets, mesh, and heaters
  # ---------------------------------------------------------------------------
  RESPOND MSG="Initializing print"
  LIGHT_ON S={lights.light_intensity_start_print}
  SET_LED LED=sb_leds RED=1 GREEN=1 BLUE=1 WHITE=1 INDEX=1 TRANSMIT=0
  SET_LED LED=sb_leds RED=1 GREEN=1 BLUE=1 WHITE=1 INDEX=2 TRANSMIT=0
  SET_LED LED=sb_leds RED=1 GREEN=1 BLUE=1 WHITE=1 INDEX=3
  SET_GCODE_OFFSET Z=0.0
  BED_MESH_CLEAR
  M104 S{warmup_temp}
  M140 S{target_bed}

  # ---------------------------------------------------------------------------
  # Initial homing and nozzle scrub at 150C (no purge)
  # ---------------------------------------------------------------------------
  RESPOND MSG="Homing axes"
  _CG28
  RESPOND MSG="Heating nozzle to {warmup_temp}C for first scrub"
  M109 S{warmup_temp}
  RESPOND MSG="Cleaning nozzle before Z homing"
  CLEAN_NOZZLE PURGE=0
  RESPOND MSG="Homing Z"
  G28 Z
  G90

  # ---------------------------------------------------------------------------
  # Bed warmup / heat soak
  # ---------------------------------------------------------------------------
  RESPOND MSG="Heating bed to {target_bed}C"
  {% if target_bed > 70 %}
    M106 S255
    G1 X{x_wait} Y{y_wait} Z15 F12000
    RESPOND MSG="Heat soak: {soak_time} min"
    HEATSOAK_BED TEMP={target_bed} SOAKTIME={soak_time}
  {% else %}
    M190 S{target_bed}
  {% endif %}

  # ---------------------------------------------------------------------------
  # Bed alignment and fresh adaptive mesh
  # ---------------------------------------------------------------------------
  RESPOND MSG="Adjusting Z tilt"
  Z_TILT_ADJUST
  RESPOND MSG="Rehoming Z after tilt adjustment"
  G28 Z
  RESPOND MSG="Probing adaptive bed mesh"
  BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=5

  # ---------------------------------------------------------------------------
  # Move over left purge bucket before final nozzle heating
  # ---------------------------------------------------------------------------
  RESPOND MSG="Moving to purge bucket"
  G90
  G1 Z{purge.brush_top + purge.clearance_z} F{purge.prep_spd_z}
  G1 X{purge.bucket_start + (purge.bucket_left_width / 2)} Y{printer.toolhead.axis_maximum.y} F{purge.prep_spd_xy}

  # ---------------------------------------------------------------------------
  # Final nozzle heat, purge, and scrub
  # ---------------------------------------------------------------------------
  RESPOND MSG="Heating nozzle to {target_extruder}C"
  M107
  M109 S{target_extruder}
  #CLEAN_NOZZLE PURGE=1

  # ---------------------------------------------------------------------------
  # Final Z home at print temperature (accounts for hotend thermal expansion).
  # Wipe first so ooze doesn't land on the Z endstop pin.
  # ---------------------------------------------------------------------------
  RESPOND MSG="Wiping nozzle before final Z home"
  CLEAN_NOZZLE PURGE=0
  RESPOND MSG="Final Z home at {target_extruder}C"
  G28 Z
  G90
  RESPOND MSG="Adaptive Line Purge"
  LINE_PURGE

  # ---------------------------------------------------------------------------
  # Start print
  # ---------------------------------------------------------------------------
  LIGHT_ON S={lights.light_intensity_printing}
  RESPOND MSG="Printing"
