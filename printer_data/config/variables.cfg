## Shared settings read by the macros in macros/.
## Pruned Nov 2026: only variables that a macro actually reads are kept.

[gcode_macro _USER_VARIABLES_OTHER]
## General
variable_verbose: True                                  # heatsoak.cfg

## Travel / parking                                     # park.cfg, print_pause_resume.cfg
variable_travel_speed: 350
variable_z_drop_speed: 30
variable_park_position_xy: 250, 20
variable_park_lift_z: 75

## Temperatures
variable_print_default_extruder_temp: 260               # temp_check.cfg, filament_swap.cfg
variable_print_default_chamber_max_heating_time: 20     # heatsoak.cfg (HEATSOAK_CHAMBER)

## Chamber sensor                                       # heatsoak.cfg (HEATSOAK_CHAMBER)
variable_chamber_temperature_sensor_enabled: False
variable_chamber_temperature_sensor_name: "Chamber"

## End of print                                         # print_end.cfg
variable_disable_motors_in_end_print: False

## Filter                                               # filter.cfg
variable_filter_enabled: True
variable_filter_name: "filter"

## Lights                                               # lights.cfg, print_start.cfg, print_end.cfg
variable_light_enabled: True
variable_light_pin_name: "light"
variable_light_intensity_start_print: 100
variable_light_intensity_printing: 100
variable_light_intensity_end_print: 40

gcode: # Holds variables only
