## Pause / resume / cancel now come from Mainsail (mainsail.cfg).
## This file holds the settings and hooks for those macros.

## Settings for Mainsail's PAUSE / RESUME / CANCEL_PRINT (from mainsail.cfg).
## Only the values that differ from Mainsail's defaults are set here.
## Retract lengths are Mainsail's defaults: 1mm on pause, 5mm on cancel.

[gcode_macro _CLIENT_VARIABLE]
## Park at the normal spot (matches park_position_xy / park_lift_z in variables.cfg)
variable_use_custom_pos: True
variable_custom_park_x: 250.0
variable_custom_park_y: 20.0
variable_custom_park_dz: 75.0
variable_park_at_cancel: True
variable_park_at_cancel_x: 250.0
variable_park_at_cancel_y: 20.0
## Keep heaters and motors on for up to 1 hour while paused
## (the normal 30 min idle_timeout turns off heaters AND motors, which ruins a paused print)
variable_idle_timeout: 3600
## Hooks into your own lights / filter / mesh handling
variable_user_pause_macro: "_USER_PAUSE"
variable_user_resume_macro: "_USER_RESUME"
variable_user_cancel_macro: "_USER_CANCEL"
gcode:

[gcode_macro _USER_PAUSE]
description: Runs after Mainsail's PAUSE
gcode:
    LIGHT_ON

[gcode_macro _USER_RESUME]
description: Runs before Mainsail's RESUME
gcode:
    LIGHT_ON S={printer["gcode_macro _USER_VARIABLES_OTHER"].light_intensity_printing}

[gcode_macro _USER_CANCEL]
description: Runs before Mainsail's CANCEL_PRINT finishes
gcode:
    BED_MESH_CLEAR
    STOP_FILTER
    LIGHT_OFF
